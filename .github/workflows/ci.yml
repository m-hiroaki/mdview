name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
      AVALONIA_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore mdview.sln

      - name: Build
        run: dotnet build mdview.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test mdview.sln --configuration Release --no-build

      - name: Coverage
        shell: bash
        run: scripts/coverage.sh coverage/${{ matrix.os }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/${{ matrix.os }}
